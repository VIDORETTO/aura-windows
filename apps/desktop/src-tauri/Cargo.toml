[package]
name = "aura-desktop"
description = "Aura desktop shell (Tauri 2): windows, tray, hotkeys and IPC over aura-app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "aura"

[[bin]]
name = "aura"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aura-app.workspace = true
aura-web = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
base64.workspace = true
aura-core.workspace = true
aura-codex.workspace = true
aura-policy.workspace = true
aura-extensions.workspace = true
aura-gateway.workspace = true
aura-auth.workspace = true
aura-asr.workspace = true
aura-store.workspace = true
aura-ingest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
aura-win.workspace = true
aura-capture = { workspace = true, features = ["store"] }
aura-audio = { workspace = true, features = ["store"] }
# Same versions Tauri/wry use: native context menu and browser keys (webview_guard).
webview2-com = "0.39"
windows = "0.62"

[features]
# Enables opt-in external network fixtures and loopback authorization for QA.
# Not part of production or default demo builds.
e2e = ["dep:aura-web", "dep:futures"]
# Runs the host with the in-process fake app-server and synthetic OS adapters
# (no ChatGPT account, no Windows APIs needed) — for UI work and demos.
demo = []
