[package]
name = "aura-bench"
description = "Performance budgets (010 TK-004): portable host scenarios + Windows process probes, compared against a versioned baseline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host"]
# Scenarios that drive the real host (fake app-server); off for the
# `--target x86_64-pc-windows-msvc` type-check from Linux.
host = ["dep:aura-app", "dep:aura-capture", "dep:aura-codex", "dep:aura-core", "dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
aura-app = { workspace = true, optional = true }
aura-capture = { workspace = true, optional = true }
aura-codex = { workspace = true, optional = true }
aura-core = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile.workspace = true
