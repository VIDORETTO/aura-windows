# Protótipo do spike S3/S4 (esforço 046). Fora do workspace do produto.
# Ferramenta de campo: grava só números (contagens, tempos, tamanhos).
[package]
name = "s3-momentos"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image-webp = "0.2"
windows-core = "0.62"
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Globalization", "Graphics", "Graphics_Capture", "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_System_Com", "Win32_System_Console", "Win32_System_ProcessStatus",
  "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Xps",
] }

[profile.release]
opt-level = 2
