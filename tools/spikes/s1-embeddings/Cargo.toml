# Protótipo do spike S1 (esforço 042). Fora do workspace do produto.
[package]
name = "s1-embeddings"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ort = "=2.0.0-rc.12"
ndarray = "0.17"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
