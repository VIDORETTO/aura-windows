name: Release

on:
  # Publication is held after the 2026-10-05 updater-key rotation.
  # See docs/qa/release-020-2026-10-05.md before enabling tag releases again.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # A manual run must select a version tag; a branch name is not a release version.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - shell: pwsh
        run: ./scripts/prepare-sidecars.ps1 -Release
      # Updates must be verifiable: no placeholder key, no unsigned artifacts (QA-038).
      - run: node scripts/check-updater-key.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Code signing: configure Azure Trusted Signing or a PFX (see docs/HANDOFF.md → Release).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Aura ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          prerelease: ${{ contains(github.ref_name, '-') }}
